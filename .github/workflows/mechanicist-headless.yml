name: Mechanicist Factorio | official 2.1 headless validation

on:
  push:
    branches: [main]
    paths:
      - 'mechanicist-factorio_0.1.2/**'
      - 'ci/**'
      - 'README.md'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/mechanicist-headless.yml'
  pull_request:
    paths:
      - 'mechanicist-factorio_0.1.2/**'
      - 'ci/**'
      - '.github/workflows/mechanicist-headless.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  factorio-headless:
    name: Only Mechanicist + official Factorio modules
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated Factorio 2.1 mod metadata and source
        run: |
          python3 -m py_compile ci/verify.py ci/run_headless.py ci/package_mod.py ci/publish_mod_portal.py
          python3 ci/verify.py

      - name: Package exact release archive and verify source parity
        run: |
          python3 ci/package_mod.py \
            --source mechanicist-factorio_0.1.2 \
            --output-dir test-artifacts

      - name: Resolve current official stable Factorio 2.1 headless release
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, urllib.request
          request = urllib.request.Request(
              "https://factorio.com/api/latest-releases",
              headers={"User-Agent": "Mechanicist-Factorio-CI/1"})
          with urllib.request.urlopen(request, timeout=30) as response:
              version = json.load(response)["stable"]["headless"]
          if not re.fullmatch(r"2\.1\.\d+", version):
              raise SystemExit(f"Expected stable Factorio 2.1 headless; received {version}")
          print(f"version={version}")
          PY

      - name: Download and verify official 2.1 headless server
        shell: bash
        env:
          VERSION: ${{ steps.engine.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p test-artifacts
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/factorio.tar.xz" \
            "https://factorio.com/get-download/${VERSION}/headless/linux64"
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/factorio/bin/x64/factorio" --version | tee test-artifacts/factorio-version.txt
          grep -Fq "$VERSION" test-artifacts/factorio-version.txt

      - name: Load, simulate and run private server (base / rails / quality / full Space Age)
        run: |
          python3 ci/run_headless.py \
            --binary "$RUNNER_TEMP/factorio/bin/x64/factorio" \
            --package "test-artifacts/mechanicist-factorio_0.1.2.zip" \
            --work "$RUNNER_TEMP/mechanicist-ci" \
            --artifacts test-artifacts

      - name: Publish failures and exact per-mode evidence
        if: always()
        shell: bash
        run: |
          if [[ -f test-artifacts/summary.md ]]; then
            cat test-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Headless suite did not reach execution; inspect setup steps.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish tested installable Factorio mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mechanicist-factorio-installable
          path: |
            test-artifacts/mechanicist-factorio_0.1.2.zip
            test-artifacts/mechanicist-factorio_0.1.2.zip.sha256
          if-no-files-found: error

      - name: Preserve complete creation, simulation, server and error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanicist-factorio-2.1-headless-evidence
          path: test-artifacts/
          if-no-files-found: warn

  publish-release:
    name: Publish tested v0.1.2 ZIP to GitHub Releases
    needs: [factorio-headless]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download same installation ZIP tested by headless CI
        uses: actions/download-artifact@v4
        with:
          name: mechanicist-factorio-installable
          path: dist

      - name: Verify release package and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mechanicist-factorio_0.1.2.zip
          test -s dist/mechanicist-factorio_0.1.2.zip.sha256
          (cd dist && sha256sum --check mechanicist-factorio_0.1.2.zip.sha256)

      - name: Publish verified v0.1.2 versioned release (never retag)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.1.2"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keep published version intact."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag exists without release; refuse to move an existing tag."
            exit 1
          fi
          gh release create "$tag" \
            dist/mechanicist-factorio_0.1.2.zip \
            dist/mechanicist-factorio_0.1.2.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Mechanicist Factorio v0.1.2 — Factorio 2.1 compatible" \
            --notes-file RELEASE_NOTES.md \
            --latest
          gh release view "$tag" --json url,tagName,isDraft,isPrerelease,assets

  publish-mod-portal:
    name: Upload verified GitHub ZIP to existing Factorio Mod Portal listing
    needs: [factorio-headless, publish-release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download exact already-published GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download v0.1.2 --dir dist --pattern 'mechanicist-factorio_0.1.2.zip*'

      - name: Verify official released asset digest
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mechanicist-factorio_0.1.2.zip
          test -s dist/mechanicist-factorio_0.1.2.zip.sha256
          (cd dist && sha256sum --check mechanicist-factorio_0.1.2.zip.sha256)

      - name: Upload release to Factorio Mod Portal and verify SHA1 readback
        shell: bash
        env:
          FACTORIO_MOD_UPLOAD_KEY: ${{ secrets.FACTORIO_MOD_UPLOAD_KEY }}
        run: |
          set -euo pipefail
          python3 ci/publish_mod_portal.py \
            --mod mechanicist-factorio \
            --version 0.1.2 \
            --zip dist/mechanicist-factorio_0.1.2.zip
